<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RECTAS Y CURVAS ENTRE EJES</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <h1>RECTAS Y CURVAS ENTRE EJES</h1>
  <p>Cambiá el ángulo de los ejes y mirá cómo se forma la curva.</p>
</header>

<svg id="cv" role="img" aria-label="Rectas que unen puntos de dos ejes y forman una curva">
  <g id="scene"></g>
  <g id="hd"><circle r="22" fill="transparent"/><circle r="11" fill="#fff" stroke="#17214d" stroke-width="3"/><circle r="4" fill="#17214d"/></g>
  
  <!-- Personaje Triángulo -->
  <g id="char" transform="translate(60, 60)" style="cursor: grab;">
    <!-- Patitas -->
    <ellipse id="foot-l" cx="-14" cy="46" rx="9" ry="5" fill="#f59e0b"/>
    <ellipse id="foot-r" cx="14" cy="46" rx="9" ry="5" fill="#f59e0b"/>
    <!-- Manitos -->
    <path id="arm-l" d="M -24 18 Q -40 16 -34 6" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path id="arm-r" d="M 24 18 Q 40 16 34 6" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Cuerpo Triangular -->
    <polygon id="char-body" points="0,-36 -38,40 38,40" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Ojos -->
    <ellipse cx="-11" cy="8" rx="6" ry="8" fill="#fff"/>
    <ellipse cx="11" cy="8" rx="6" ry="8" fill="#fff"/>
    <circle id="pupil-l" cx="-11" cy="9" r="3.2" fill="#17214d"/>
    <circle id="pupil-r" cx="11" cy="9" r="3.2" fill="#17214d"/>
    
    <!-- Boca (cambia según el ángulo) -->
    <path id="char-mouth" d="M -8 24 Q 0 31 8 24" stroke="#17214d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    
    <!-- Bocadillo / Globo de diálogo -->
    <g id="bubble" transform="translate(24, -46)">
      <rect rx="8" ry="8" width="130" height="28" fill="#ffffff" stroke="#17214d" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
      <polygon points="4,22 -6,28 12,22" fill="#ffffff"/>
      <text id="char-speech" x="65" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#17214d">¡Hola! Soy Tri</text>
    </g>
  </g>
</svg>

<section class="bottom" id="ctrl">
  <div class="row"><label for="th">Ángulo</label><input id="th" type="range" min="0" max="180" step="1" value="90"><output id="thv">90°</output></div>
  <div class="btns" id="pre"></div>
  <div class="row"><label for="n">Rectas</label><input id="n" type="range" min="1" max="100" step="1" value="10"><output id="nv">10</output></div>
  <div class="btns">
    <button class="chip" id="bCurve" aria-pressed="true">Curva</button>
    <button class="chip" id="bGrid" aria-pressed="true">Cuadrícula</button>
    <button class="chip" id="bAnim" aria-pressed="false">Animar</button>
    <button class="chip" id="bReset">Restablecer colores</button>
    
    <!-- Selector rápido de color para el personaje -->
    <label class="chip" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
      <span>Color de Tri</span>
      <input type="color" id="triColor" value="#3b82f6" style="border:none;background:none;width:24px;height:24px;cursor:pointer;padding:0;">
    </label>
  </div>
  <p style="margin:6px 0 0;font-size:.78rem;color:var(--mut)">Arrastrá el punto del eje inclinado o arrastrá a Triangulín por la pantalla.</p>
</section>

<section class="bottom" id="sheet" hidden>
  <h2><i id="sdot"></i><span id="stitle"></span></h2>
  <div class="btns" id="stabs">
    <button data-t="info">Información</button>
    <button data-t="color">Cambiar color</button>
    <button data-t="vis" id="tvis">Atenuar</button>
    <button data-t="close">Volver</button>
  </div>
  <div id="sbody"></div>
</section>

<script src="app.js"></script>
</body>
</html>
